<text x="625.0" y="133.0" class="small">Início: pátio fechado</text>
<text x="625.0" y="160.0" class="small">Ronda 3: acesso à igreja</text>
<text x="625.0" y="187.0" class="small">Ronda 5: acesso à vila</text>
<text x="625.0" y="214.0" class="small">Ronda 8: saídas para o mapa</text>
<text x="625.0" y="241.0" class="small">Igreja / vila: compra antecipada</text>
<text x="625.0" y="318.0" class="label">ENTRADAS E PERCURSOS</text>
<text x="625.0" y="348.0" class="small">B1–B4: pátio inicial</text>
<text x="625.0" y="375.0" class="small">B5–B7: igreja</text>
<text x="625.0" y="402.0" class="small">B8–B11: vila</text>
<text x="625.0" y="429.0" class="small">6 tábuas por barricada</text>
<text x="625.0" y="456.0" class="small">Manter E: reparar a cada 0,8 s</text>
<text x="625.0" y="483.0" class="small">Atalhos laterais: 650 pontos cada</text>
<text x="625.0" y="510.0" class="small">Atalhos disponíveis depois da vila</text>
<text x="625.0" y="588.0" class="label">EQUIPAMENTO</text>
<text x="625.0" y="618.0" class="small">PX-9 inicial · dois espaços de arma</text>
<text x="625.0" y="645.0" class="small">SM-40: 1200 · SG-8: 1500</text>
<text x="625.0" y="672.0" class="small">AK-74: 1800 · caixa: 950</text>
<text x="625.0" y="699.0" class="small">1 / 2 / Q / roda: trocar</text>
<text x="48.0" y="810.0" class="small" style="fill:#a7b8bd">Planta esquemática. Postos procuram chão navegável próximo; percursos e transposição exigem verificação no Unity.</text>
